name: Docs

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  validate:
    name: Validate docs
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
        with:
          cache: true
          pixi-version: v0.75.0
          cache-write: ${{ github.event_name == 'push' && github.ref_name == 'main' }}

      - name: Check documentation prose
        run: pixi run vale-check

  deploy:
    name: Deploy docs
    if: github.event_name != 'pull_request' && github.ref_name == 'main'
    needs: validate
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
        with:
          cache: true
          pixi-version: v0.75.0
          cache-write: true

      - name: Deploy docs
        run: pixi exec --with mkdocs-material --with pymdown-extensions mkdocs gh-deploy --force --strict
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
