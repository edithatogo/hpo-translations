name: QC

on:
  push:
    branches:
      - main
      - codex/**
      - feature/**
      - clean-*
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  qc:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
        with:
          cache: true
          pixi-version: v0.75.0
          cache-write: ${{ github.event_name == 'push' && github.ref_name == 'main' }}

      - name: Generate translation diff audit
        if: github.event_name == 'pull_request'
        run: pixi run diff-audit

      - name: Comment translation diff audit
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@d746ffe35508b1917358783b479e04febd2b8f71 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- hpo-translations-diff-audit -->';
            const path = 'translation_diff_summary.md';
            if (!fs.existsSync(path)) {
              core.info('No translation diff summary was generated.');
              return;
            }

            const summary = fs.readFileSync(path, 'utf8').trim();
            const body = `${marker}\n${summary}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body?.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Run translation QC
        run: pixi run qc

      - name: Run Conductor validation
        run: pixi run validate-conductor

      - name: Run all repository tests
        run: pixi run test-all

      - name: Validate ontology mapping expansion catalog
        run: pixi run validate-mapping-expansion

      - name: Validate deterministic ontology mapping routes
        run: pixi run validate-mapping-routes

      - name: Check ontology mapping route drift
        run: pixi run check-mapping-route-drift

      - name: Validate terminology node and edition registry
        run: pixi run validate-terminology-node-registry

      - name: Check terminology node registry drift
        run: pixi run check-terminology-node-registry-drift

      - name: Validate open mapping rights matrix
        run: pixi run validate-open-mapping-rights

      - name: Validate terminology metadata inventories
        run: pixi run validate-terminology-inventories

      - name: Validate language readiness catalog
        run: pixi run validate-language-readiness

      - name: Validate Orphadata product inventory
        run: pixi run validate-orphadata-inventory

      - name: Validate HPO language inventory
        run: pixi run validate-hpo-language-inventory

      - name: Validate approved metadata-only samples
        run: pixi run validate-metadata-only-samples

      - name: Validate source governance decision docket
        run: pixi run validate-source-governance-docket

      - name: Build ontology network artifacts
        run: pixi run ontology-network

      - name: Validate generated ontology network artifacts
        run: pixi run validate-ontology-network-artifacts

      - name: Check ontology network artifact drift
        run: pixi run check-ontology-network-drift

      - name: Run lint checks
        run: pixi run lint
