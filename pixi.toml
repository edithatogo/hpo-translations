[workspace]
authors = ["Dylan Mordaunt <Dylan.Mordaunt@health.nsw.gov.au>"]
channels = ["conda-forge"]
name = "hpo-translations"
platforms = ["win-64"]
version = "0.1.0"

[tasks]
sort-all = { cmd = ".pixi/envs/default/python.exe -u scripts/process_translations.py sort-all", env = { PYTHONUTF8 = "1" }, inputs = ["babelon/hp-*.babelon.tsv", "babelon/hp-*.synonyms.tsv"], outputs = ["babelon/hp-*.babelon.tsv", "babelon/hp-*.synonyms.tsv"] }
clean-all = { cmd = ".pixi/envs/default/python.exe -u scripts/process_translations.py clean-all", env = { PYTHONUTF8 = "1" }, inputs = ["babelon/hp-*.babelon.tsv", "babelon/hp-*.synonyms.tsv"], outputs = ["babelon/hp-*.babelon.tsv", "babelon/hp-*.synonyms.tsv"] }
validate-all = { cmd = ".pixi/envs/default/python.exe -u scripts/process_translations.py validate-all", env = { PYTHONUTF8 = "1" }, inputs = ["babelon/hp-*.babelon.tsv", "babelon/hp-*.synonyms.tsv"], outputs = ["tmp/*-babelon.owl"] }
qc = { cmd = ".pixi/envs/default/python.exe -u scripts/process_translations.py validate-all", env = { PYTHONUTF8 = "1", HPO_VALIDATION_JOBS = "3" }, inputs = ["babelon/hp-*.babelon.tsv", "babelon/hp-*.synonyms.tsv"], outputs = ["tmp/*-babelon.owl"] }
update = { depends-on = ["sort-all", "clean-all", "validate-all"] }
ruff-check = { cmd = ".pixi/envs/default/Scripts/ruff.exe check --no-cache .", inputs = ["scripts/**/*.py", "ruff.toml"] }
ruff-format = { cmd = ".pixi/envs/default/Scripts/ruff.exe format --no-cache --check .", inputs = ["scripts/**/*.py", "ruff.toml"] }
vale-check = { cmd = ".pixi/envs/default/bin/vale.exe README.md docs/", inputs = ["README.md", "docs/**/*.md", ".vale.ini"] }
ty-check = { cmd = ".pixi/envs/default/Scripts/ty.exe check --python .pixi/envs/default/python.exe scripts/", inputs = ["scripts/**/*.py", "pyproject.toml", "pixi.lock"] }
basedpyright-check = { cmd = ".pixi/envs/default/Scripts/basedpyright.exe scripts/", inputs = ["scripts/**/*.py", "pyproject.toml"] }
typing-fast = { depends-on = ["ty-check"] }
typing-canonical = { depends-on = ["basedpyright-check"] }
actionlint-check = "actionlint"
lint = { depends-on = ["actionlint-check", "ruff-check", "ruff-format", "vale-check", "ty-check", "basedpyright-check"] }
just = ".pixi/envs/default/bin/just.exe"
cz = ".pixi/envs/default/Scripts/cz.exe"
pre-commit-install = { depends-on = ["prek-install"] }
pre-commit-run = { depends-on = ["prek-run"] }
prek-install = { cmd = "prek install --hook-type pre-commit --hook-type commit-msg", env = { PREK_HOME = "C:/tmp/hpo-translations-prek" } }
prek-run = { cmd = "prek run --all-files --show-diff-on-failure", env = { PREK_HOME = "C:/tmp/hpo-translations-prek" } }
package = ".pixi/envs/default/python.exe scripts/package_translations.py"
profile = ".pixi/envs/default/python.exe scripts/process_translations.py profile"
diff-audit = ".pixi/envs/default/python.exe scripts/diff_translations.py"
audit-translations = ".pixi/envs/default/python.exe scripts/translation_audit.py audit"
agent-export = ".pixi/envs/default/python.exe scripts/translation_audit.py export-work-items"
agent-apply-dry-run = ".pixi/envs/default/python.exe scripts/translation_audit.py apply-agent-output"
workflow-list = ".pixi/envs/default/python.exe scripts/translation_workflows.py list"
workflow-show = ".pixi/envs/default/python.exe scripts/translation_workflows.py show"
build-ontology-network = ".pixi/envs/default/python.exe -u scripts/build_ontology_network.py build"
validate-ontology-network = ".pixi/envs/default/python.exe -u scripts/build_ontology_network.py validate"
validate-ontology-network-artifacts = ".pixi/envs/default/python.exe scripts/validate_ontology_network.py --registry ontology_network/source_registry.json --crosswalk ontology_network/crosswalk_graph.json --conflict ontology_network/conflict_heatmap.json --coverage ontology_network/coverage_summary.json --review-pack ontology_network/language_review_packs.json"
check-ontology-network-drift = ".pixi/envs/default/python.exe scripts/check_ontology_network_drift.py"
validate-metadata-only-samples = ".pixi/envs/default/python.exe scripts/validate_metadata_only_samples.py"
validate-source-governance-docket = ".pixi/envs/default/python.exe scripts/validate_source_governance_docket.py"
ontology-network = ".pixi/envs/default/python.exe -u scripts/build_ontology_network.py all"
validate-conductor = ".pixi/envs/default/python.exe -u scripts/validate_conductor.py"
validate-conductor-report = ".pixi/envs/default/python.exe -u scripts/validate_conductor.py --json-output tmp/conductor_validation_report.json --text-output tmp/conductor_validation_report.md --ci-output tmp/conductor_validation_summary.md"
test-all = ".pixi/envs/default/python.exe -m unittest discover -s tests -p test_*.py"
test-conductor-validation = { depends-on = ["test-all"] }
validate-research-validation = ".pixi/envs/default/python.exe -u -m scripts.validate_research_validation"
validate-mapping-expansion = ".pixi/envs/default/python.exe -u -m scripts.validate_mapping_expansion"
build-mapping-routes = ".pixi/envs/default/python.exe -u scripts/build_mapping_routes.py"
validate-mapping-routes = ".pixi/envs/default/python.exe -u -m scripts.validate_mapping_routes"
check-mapping-route-drift = ".pixi/envs/default/python.exe -u scripts/build_mapping_routes.py --check"
build-terminology-node-registry = ".pixi/envs/default/python.exe -u scripts/build_terminology_node_registry.py"
validate-terminology-node-registry = ".pixi/envs/default/python.exe -u -m scripts.validate_terminology_node_registry"
check-terminology-node-registry-drift = ".pixi/envs/default/python.exe -u scripts/build_terminology_node_registry.py --check"
validate-open-mapping-rights = ".pixi/envs/default/python.exe -u -m scripts.validate_open_mapping_rights"
validate-terminology-inventories = ".pixi/envs/default/python.exe -u -m scripts.validate_terminology_inventories"
validate-language-readiness = ".pixi/envs/default/python.exe -u -m scripts.validate_language_readiness"
validate-orphadata-inventory = ".pixi/envs/default/python.exe -u -m scripts.validate_orphadata_inventory"
validate-hpo-language-inventory = ".pixi/envs/default/python.exe -u scripts/validate_hpo_language_inventory.py"
validate-translation-source-utilisation = ".pixi/envs/default/python.exe -u -m scripts.validate_translation_source_utilisation"
validate-orthogonal-biomedical-sources = ".pixi/envs/default/python.exe -u -m scripts.validate_orthogonal_biomedical_sources"
validate-next-language-pilot = ".pixi/envs/default/python.exe -u -m scripts.validate_next_language_pilot"
validate-registry-source-expansion = ".pixi/envs/default/python.exe -u -m scripts.validate_registry_source_expansion"
validate-ga4gh-relevance = ".pixi/envs/default/python.exe -u -m scripts.validate_ga4gh_relevance"
validate-snomed-icd-bridges = ".pixi/envs/default/python.exe -u -m scripts.validate_snomed_icd_bridges"
validate-babelnet-linguistic-anchor = ".pixi/envs/default/python.exe -u -m scripts.validate_babelnet_linguistic_anchor"
validate-source-payload-archive = ".pixi/envs/default/python.exe -u -m scripts.archive_source_payloads"
archive-source-payloads-local = ".pixi/envs/default/python.exe -u -m scripts.archive_source_payloads --execute"
archive-source-payloads-receipt = ".pixi/envs/default/python.exe -u -m scripts.archive_source_payloads --execute --receipt-path research_validation/source_payload_archive_receipts.json"
test-research-validation = ".pixi/envs/default/python.exe -m unittest discover -s tests -p test_validate_research_validation.py"
verify-research-source-pins = ".pixi/envs/default/python.exe -u scripts/verify_research_sources.py"
run-stage-0-rehearsal = ".pixi/envs/default/python.exe -u scripts/run_stage0_rehearsal.py"
generate-pilot-source-atoms = { cmd = ".pixi/envs/default/python.exe -u scripts/generate_pilot_source_atoms.py", inputs = ["research_validation/pilot_source_payload_manifest.json", "babelon/hp-es.babelon.tsv", "babelon/hp-ja.babelon.tsv", "scripts/generate_pilot_source_atoms.py"], outputs = ["research_validation/pilot_source_atoms.jsonl.gz", "research_validation/pilot_independent_lineage_groups.json"] }
freeze-phase4-g3 = { cmd = ".pixi/envs/default/python.exe -u scripts/freeze_phase4_g3.py", inputs = ["scripts/freeze_phase4_g3.py", "scripts/analyze_phase4_pilot.py", "pixi.lock", "research_validation/agent_review_panel.json", "research_validation/approval_manifest.json", "research_validation/pilot_source_payload_manifest.json", "research_validation/pilot_source_atoms.jsonl.gz", "babelon/hp-es.babelon.tsv", "babelon/hp-ja.babelon.tsv"], outputs = ["research_validation/phase_4_freeze/component_manifest.json", "research_validation/phase_4_freeze/freeze_receipt.json"] }

[dependencies]
python = ">=3.14.6,<3.15"
setuptools = ">=83,<84"
ruff = ">=0.15.18,<0.16"
vale = ">=3.15.1,<4"
ty = "*"
basedpyright = "*"
just = ">=1.43.1,<2"
actionlint = ">=1.7.12,<1.8"
prek = ">=0.4.13,<0.5"

[pypi-dependencies]
babelon = ">=0.3.6"
tsvalid = ">=0.0.5"
curies = ">=0.7.7"
linkml = ">=1.11.1,<2"
linkml-runtime = ">=1.11.1,<2"
commitizen = ">=3.21.0,<4"
mkdocs = ">=1.6.0"
mkdocs-material = ">=9.5.0"

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.1.0"
tag_format = "v$version"
version_files = [
    "pixi.toml:version",
]
