[project]
name = "hpo-translations"
version = "0.1.0"
description = "HPO Translations"
requires-python = ">=3.14.6,<3.15"
dependencies = [
    "babelon>=0.3.6",
    "tsvalid>=0.0.5",
    "linkml>=1.10",
    "linkml-runtime>=1.10",
    "setuptools<81",
]

[tool.basedpyright]
include = ["scripts"]
pythonVersion = "3.14"
typeCheckingMode = "standard"
